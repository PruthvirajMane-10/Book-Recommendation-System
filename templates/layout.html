<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Recommender</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    body { 
        background-color: #121212; 
        color: #e0e0e0; 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    .navbar { background-color: #1f1f1f; border-bottom: 2px solid #ffc107; }

    /* Card Improvements */
    .card { 
        background-color: #1f1f1f; 
        border: 1px solid #333; 
        transition: transform 0.2s, box-shadow 0.2s;
        border-radius: 10px;
        overflow: hidden;
    }
    
    .card:hover { 
        transform: translateY(-5px);
        box-shadow:
        0 0 5px #e3dea2,
        0 0 15px #e3e1b2,
        0 0 30px #e3e1b2;
    }

    /* Visibility Fixes */
    .book-title { 
        color: #ffc107 !important; /* Bright Yellow for contrast */
        font-weight: bold;
        font-size: 1.1rem;
        margin-top: 10px;
    }

    .book-author { 
        color: #ffffff !important; /* Pure white for secondary text */
        font-style: italic;
        opacity: 0.9;
    }

    .recommendation-container {
        background: rgba(255, 255, 255, 0.05);
        padding: 30px;
        border-radius: 15px;
    }
</style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">My Book Recommender</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Top 50 Books</a>
                <a class="nav-link" href="/recommend">Get Recommendations</a>
            </div>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
